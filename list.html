<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar and Content</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="list.css">
  <link rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>

  <header class="header">
    <div class="header-container">
      <div class="logo">
        <img src="logo00.png" alt="Logo 1" class="logo-img">
        <img src="logo01.png" alt="Logo 2" class="logo-img">
      </div>

      <div class="text-options">
        <!-- ✅ กกก และ ไทย ENG อยู่บรรทัดเดียวกัน -->
        <div class="text-row">
          <ul class="font-size-options">
            <li><a href="#" class="size-1">ก</a></li>
            <li class="active"><a href="#" class="size-2">ก</a></li>
            <li><a href="#" class="size-3">ก</a></li>
          </ul>
          <ul class="language-options">
            <li><a href="#" class="Thai">ไทย</a></li>
            <li>|</li>
            <li><a href="#">ENG</a></li>
          </ul>
        </div>

        <!-- ✅ เบอร์โทรศัพท์อยู่บรรทัดถัดไป -->
        <div class="phone-number">026-845-9715</div>
      </div>
    </div>
    <!-- ✅ Navbar Section -->
  </header>
  <nav class="navbar">
    <ul class="nav">
      <li><a href="#">Home</a></li>
      <li><a href="#">Register</a></li>
      <li><a href="#">Team</a></li>
      <li><a href="#">Standings</a></li>
      <li><a href="#">Match Schedule</a></li>
      <li><a href="#">Scout</a></li>
    </ul>
  </nav>

  <div class="main_bar">
    <div class="tab_bar">
      <ul class="tab">
        <li><a href="#" onclick="showTable()">รายชื่อ</a></li>
        <li><a href="#" onclick="showGrid()">แผงรูป</a></li>
    </ul>
    </div>
  </div>

  <div class="container">
    <div class="search">
      <span class="material-symbols-outlined">search</span>
      <input class="search-input" type="text" id="search" placeholder="search..." onkeyup="searchTable()">
      <button onclick="openPopup()">เพิ่มข้อมูล</button>
      <button onclick="">Export</button>
      <button onclick="">ยืนยัน</button>
    </div>    
    <div class="popup" id="popup">
        <h3>เพิ่มข้อมูลนักกีฬา</h3>
        <input type="text" id="name" placeholder="ชื่อ-นามสกุล">
        <input type="text" id="idCard" placeholder="เลขบัตรประชาชน">
        <input type="date" id="dob">
        <input type="number" id="jerseyNumber" placeholder="หมายเลขเสื้อ">
        <select id="position">
            <option value="กองหน้า">กองหน้า</option>
            <option value="กองกลาง">กองกลาง</option>
            <option value="กองหลัง">กองหลัง</option>
            <option value="ผู้รักษาประตู">ผู้รักษาประตู</option>
        </select>
        <input type="file" id="image" accept="image/*" onchange="previewImage()">
        <img id="imagePreview" class="preview-img" style="display:none;">
        <button onclick="addPlayer()">บันทึก</button>
        <button onclick="closePopup()">ยกเลิก</button>
    </div>
<!-- ฝั่งรายชื่อ -->
<div id="playerTableContainer">
  <table id="playerTable">
      <tr>
          <th>ลำดับ</th>
          <th>เบอร์เสื้อ</th>
          <th>ชื่อ</th>
          <th>วันเกิด</th>
          <th>ตำแหน่ง</th>
          <th>รูปภาพ</th>
          <th>ลบ</th>
      </tr>
  </table>
</div>

<!-- ฝั่งแผงรูป -->
<div id="playerGridContainer" style="display: none;">
  <div id="playerGrid" class="grid-container"></div>
</div>

</div>
  <script src="script.js"></script>
</body>
